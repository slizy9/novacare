# NovaCare on the ship: the app, plus the ship server under /ship/ on the same address.
# Same origin means one port to open on the ship network and no cross-origin setup.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The ship build of js/config.js (SHIP_SERVER_URL set). The public website keeps the repo's js/config.js.
  location = /js/config.js {
    alias /etc/novacare/config.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }

  location /ship/ {
    # look the server up on each request (Docker DNS), so nginx starts and recovers even if
    # the ship container restarts with a new address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ship_upstream http://ship:8787;
    rewrite ^/ship/(.*)$ /$1 break;
    proxy_pass $ship_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 25m;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
