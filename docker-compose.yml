# NovaCare on the ship's terminal — everything local, no internet needed after the first setup.
#
#   docker compose up -d        → open http://localhost:8080
#
# Services
#   web     the NovaCare app (static files served by nginx), with the ship server under /ship/
#   ship    the crew database on the ship's own network (ship/server.js): accounts, missions,
#           crew status, emergency alerts and the shared inventory between devices. No internet.
#   llm     a small local language model (Ollama). Wording only: the rules engine decides
#           medication questions and answers come from the onboard knowledge base (js/kb.js).
#   llm-pull  downloads the model once, then exits. After that the stack runs fully offline.
#
# The app works without the llm service too: answers then show the protocol text directly.

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./ship/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ship/config.js:/etc/novacare/config.js:ro   # served as js/config.js: SHIP_SERVER_URL is set
    depends_on:
      - ship
    restart: unless-stopped

  ship:
    image: node:22.20-alpine     # Node 22.13+ has the built-in SQLite the server uses
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - DATA_DIR=/data
      - SHIP_RESET_CODE=${SHIP_RESET_CODE:-}   # optional: choose the crew password-reset code
    ports:
      - "8787:8787"                 # optional direct access; the app uses http://<terminal>:8080/ship/
    volumes:
      - ./ship:/app:ro
      - ship-data:/data
    restart: unless-stopped

  llm:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*          # let the NovaCare page on this terminal call the model
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  llm-pull:
    image: ollama/ollama:0.5.7
    depends_on:
      - llm
    environment:
      - OLLAMA_HOST=llm:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull qwen2.5:1.5b"]
    restart: "no"

volumes:
  ollama:
  ship-data:
